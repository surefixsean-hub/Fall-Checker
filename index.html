<script>
(() => {

let readings = [];
const MAX = 30;

let offset = 0;
let isHeld = false;

let inspectionMode = false;
let startCaptured = false;
let startAngle = 0;

let photoData = null;

const percentEl = document.getElementById("slopePercent");
const ratioEl = document.getElementById("ratioText");
const fallEl = document.getElementById("riseFall");
const statusEl = document.getElementById("statusPill");

const runInput = document.getElementById("runInput");

// -------- BUTTON HELPER --------
function addBtn(text, fn){
  let b = document.createElement("button");
  b.innerText = text;
  b.style.margin="5px";
  b.onclick = fn;
  document.body.appendChild(b);
}

// -------- PHOTO --------
let file = document.createElement("input");
file.type = "file";
file.accept = "image/*";
file.onchange = e=>{
  let r = new FileReader();
  r.onload = ev=> photoData = ev.target.result;
  r.readAsDataURL(e.target.files[0]);
};
document.body.appendChild(file);

// -------- NCC PRESETS --------
addBtn("Shower 1:80-1:50", ()=>setPreset(80,50));
addBtn("Bathroom 1:100-1:60", ()=>setPreset(100,60));
addBtn("Laundry 1:100-1:60", ()=>setPreset(100,60));

function setPreset(f,s){
  document.getElementById("flatInput").value=f;
  document.getElementById("steepInput").value=s;
}

// -------- ONE TAP --------
addBtn("START INSPECTION", startInspection);
addBtn("Save PDF", savePDF);

function startInspection(){
  inspectionMode = true;
  startCaptured = false;
  alert("Hold phone at start and keep still");
}

// -------- MATH --------
function smooth(v){
  readings.push(v);
  if(readings.length>MAX) readings.shift();
  return readings.reduce((a,b)=>a+b,0)/readings.length;
}

function percent(a){
  return Math.abs(Math.tan(a*Math.PI/180))*100;
}

function isStable(){
  if(readings.length<10) return false;
  let s = readings.slice(-10);
  let avg = s.reduce((a,b)=>a+b)/s.length;
  let dev = s.reduce((a,b)=>a+Math.abs(b-avg),0)/s.length;
  return dev < 0.2;
}

// -------- UPDATE --------
function update(angle){

  if(isHeld) return;

  let a = smooth(angle - offset);

  let p = percent(a);
  let r = 100/p;

  let run = parseFloat(runInput.value) || 1000;
  let fall = run * p/100;

  percentEl.innerText = p.toFixed(2)+"%";
  ratioEl.innerText = "1:"+r.toFixed(0);
  fallEl.innerText = fall.toFixed(1)+" mm";

  let flat = parseFloat(document.getElementById("flatInput").value);
  let steep = parseFloat(document.getElementById("steepInput").value);

  let min = run/flat;
  let max = run/steep;

  if(fall>=min && fall<=max){
    statusEl.innerText="COMPLIANT";
    statusEl.style.color="green";
  } else {
    statusEl.innerText="NON-COMPLIANT";
    statusEl.style.color="red";
  }

  // -------- ONE TAP MODE --------
  if(inspectionMode){

    if(!startCaptured && isStable()){
      startAngle = readings[readings.length-1];
      startCaptured = true;
      alert("Start captured ✅ move to waste");
    }

    else if(startCaptured && isStable()){

      let end = readings[readings.length-1];
      let diff = end - startAngle;

      let p2 = percent(diff);
      let r2 = 100/p2;

      let fall2 = run * p2/100;

      percentEl.innerText = p2.toFixed(2)+"%";
      ratioEl.innerText = "1:"+r2.toFixed(0);
      fallEl.innerText = fall2.toFixed(1)+" mm";

      if(fall2>=min && fall2<=max){
        statusEl.innerText="COMPLIANT";
        statusEl.style.color="green";
      } else {
        statusEl.innerText="NON-COMPLIANT";
        statusEl.style.color="red";
      }

      inspectionMode=false;
      alert("Inspection complete ✅");
    }
  }
}

// -------- SENSOR --------
async function enable(){
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    await DeviceOrientationEvent.requestPermission();
  }
  window.addEventListener("deviceorientation", e=>{
    if(e.beta) update(e.beta);
  });
}

document.getElementById("enableBtn").onclick = enable;

// -------- CONTROLS --------
document.getElementById("calBtn").onclick = ()=>{
  offset = readings[readings.length-1] || 0;
};
document.getElementById("holdBtn").onclick = ()=>{
  isHeld=!isHeld;
};

// -------- PDF --------
function savePDF(){

  let run = runInput.value;
  let percentText = percentEl.innerText;
  let ratioText = ratioEl.innerText;
  let fallText = fallEl.innerText;

  let flat = document.getElementById("flatInput").value;
  let steep = document.getElementById("steepInput").value;

  let min = run/flat;
  let max = run/steep;

  let html = `
  <h2>Fall Inspection</h2>
  <p>Date: ${new Date().toLocaleString()}</p>
  <p>Slope: ${percentText}</p>
  <p>Ratio: ${ratioText}</p>
  <p>Distance: ${run}mm</p>
  <p>Fall: ${fallText}</p>
  <p>Required: ${min.toFixed(1)} - ${max.toFixed(1)} mm</p>
  ${photoData ? `<img src="${photoData}" style="width:100%">`:""}
  `;

  let w = window.open("");
  w.document.write(html);
  w.print();
}

})();
</script>
