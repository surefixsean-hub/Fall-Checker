<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { font-family: Arial; text-align: center; }

.card {
  border: 1px solid #ccc;
  padding: 15px;
  margin: 10px;
  border-radius: 10px;
}

button {
  margin:5px;
  padding:10px;
  font-size:14px;
}
</style>

</head>

<body>

<h2>Fall Checker</h2>

<div class="card">
  <h3 id="statusPill">NOT RUNNING</h3>
  <h1 id="slopePercent">0%</h1>
  <h3 id="ratioText">1:0</h3>
  <p id="riseFall">0 mm</p>
</div>

<div class="card">
<label>Distance (mm)</label><br>
<input id="runInput" value="1500"><br><br>

<label>Flattest (1:N)</label><br>
<input id="flatInput" value="80"><br>

<label>Steepest (1:N)</label><br>
<input id="steepInput" value="50">
</div>

<div id="panel" class="card"></div>

<script>
(() => {

// ===== STATE =====
let readings = [];
let offset = 0;

let inspectionMode = false;
let stage = 0;
let startAngle = 0;
let finalResult = null;

let photoData = null;

// ===== UI =====
const percentEl = document.getElementById("slopePercent");
const ratioEl = document.getElementById("ratioText");
const fallEl = document.getElementById("riseFall");
const statusEl = document.getElementById("statusPill");
const runInput = document.getElementById("runInput");
const panel = document.getElementById("panel");

// ===== BUTTONS =====
function addBtn(txt, fn){
  let b = document.createElement("button");
  b.innerText = txt;
  b.onclick = fn;
  panel.appendChild(b);
}

addBtn("Enable Motion", enable);
addBtn("Calibrate", calibrate);
addBtn("START INSPECTION", startInspection);
addBtn("Save PDF", savePDF);

// presets
addBtn("Shower", ()=>setPreset(80,50));
addBtn("Bathroom", ()=>setPreset(100,60));
addBtn("Laundry", ()=>setPreset(100,60));

// ===== PHOTO =====
let file = document.createElement("input");
file.type = "file";
file.accept = "image/*";
file.style.display="block";

file.onchange = e=>{
  let reader = new FileReader();
  reader.onload = ev => photoData = ev.target.result;
  reader.readAsDataURL(e.target.files[0]);
};

panel.appendChild(file);

// ===== HELPERS =====
function setPreset(f,s){
 document.getElementById("flatInput").value=f;
 document.getElementById("steepInput").value=s;
}

function smooth(v){
 readings.push(v);
 if(readings.length>20) readings.shift();
 return readings.reduce((a,b)=>a+b,0)/readings.length;
}

function percent(a){
 return Math.abs(Math.tan(a*Math.PI/180))*100;
}

function isStable(){
 if(readings.length<10) return false;
 let s=readings.slice(-10);
 let avg=s.reduce((a,b)=>a+b)/s.length;
 let dev=s.reduce((a,b)=>a+Math.abs(b-avg),0)/s.length;
 return dev < 0.25;
}

function movedEnough(){
 if(readings.length<10) return false;
 let first=readings[readings.length-10];
 let last=readings[readings.length-1];
 return Math.abs(last-first)>1;
}

// ===== MOTION =====
async function enable(){
 if(typeof DeviceOrientationEvent.requestPermission==="function"){
  await DeviceOrientationEvent.requestPermission();
 }

 window.addEventListener("deviceorientation", e=>{
  if(e.beta!=null){
   update(e.beta);
  }
 });

 alert("Motion Enabled ✅");
}

// ===== CALIBRATE =====
function calibrate(){
 offset = readings[readings.length-1] || 0;
 alert("Calibrated ✅");
}

// ===== START =====
function startInspection(){
 inspectionMode=true;
 stage=0;
 finalResult = null;

 alert("Hold at start");
}

// ===== UPDATE =====
function update(angle){

 // DO NOT overwrite final locked result
 if(finalResult) return;

 let a = smooth(angle-offset);
 let p = percent(a);
 let r = p>0 ? 100/p : 0;

 let run = parseFloat(runInput.value)||1000;

 let flat=parseFloat(document.getElementById("flatInput").value);
 let steep=parseFloat(document.getElementById("steepInput").value);

 let min=run/flat;
 let max=run/steep;

 let fall = run * p/100;

 percentEl.innerText = p.toFixed(2)+"%";
 ratioEl.innerText = "1:"+r.toFixed(0);
 fallEl.innerText = fall.toFixed(1)+" mm";

 let compliant = (fall>=min && fall<=max);

 statusEl.innerText = compliant ? "✅ COMPLIANT" : "❌ NON-COMPLIANT";
 statusEl.style.color = compliant ? "green" : "red";

 // ===== INSPECTION =====
 if(inspectionMode){

  if(stage===0 && isStable()){
    startAngle=a;
    stage=1;
    alert("Start captured ✅ move to waste");
    return;
  }

  if(stage===1 && movedEnough()){
    stage=2;
    return;
  }

  if(stage===2 && isStable()){

   let diff = a-startAngle;
   let p2 = percent(diff);
   let r2 = 100/p2;
   let fall2 = run * p2/100;

   percentEl.innerText = p2.toFixed(2)+"%";
   ratioEl.innerText = "1:"+r2.toFixed(0);
   fallEl.innerText = fall2.toFixed(1)+" mm\nRequired: "+min.toFixed(1)+"–"+max.toFixed(1)+" mm";

   let compliant2 = (fall2>=min && fall2<=max);

   statusEl.innerText = compliant2 ? "✅ COMPLIANT" : "❌ NON-COMPLIANT";
   statusEl.style.color = compliant2 ? "green" : "red";

   // LOCK FINAL RESULT (IMPORTANT)
   finalResult = {
     percent:p2,
     ratio:r2,
     fall:fall2,
     min:min,
     max:max,
     compliant:compliant2
   };

   inspectionMode=false;

   alert("Inspection complete ✅");
  }
 }

}

// ===== PDF =====
function savePDF(){

 if(!finalResult){
   alert("Run inspection first");
   return;
 }

 let html = `
 <h2>Fall Inspection Report</h2>
 <p>Date: ${new Date().toLocaleString()}</p>
 <p>Slope: ${finalResult.percent.toFixed(2)}%</p>
 <p>Ratio: 1:${finalResult.ratio.toFixed(0)}</p>
 <p>Distance: ${runInput.value} mm</p>
 <p>Measured Fall: ${finalResult.fall.toFixed(1)} mm</p>
 <p>Required: ${finalResult.min.toFixed(1)} – ${finalResult.max.toFixed(1)} mm</p>
 <p>Status: ${finalResult.compliant ? "COMPLIANT" : "NON-COMPLIANT"}</p>
 ${photoData ? `<img src="${photoData}" style="width:100%">` : "<p>No photo</p>"}
 `;

 let w = window.open("");
 w.document.write(html);
 w.print();
}

})();
</script>

</body>
</html>
