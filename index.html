<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  font-family: Arial;
  margin:0;
  background:#f5f6fa;
  text-align:center;
}

.header {
  background:#2f3640;
  color:white;
  padding:15px;
}

.card {
  background:white;
  border-radius:10px;
  padding:15px;
  margin:10px;
  box-shadow:0 2px 6px rgba(0,0,0,0.1);
}

.big { font-size:28px; font-weight:bold; }
.good { color:green; }
.bad { color:red; }

button {
  margin:5px;
  padding:10px;
  font-size:14px;
  border-radius:6px;
  border:1px solid #ccc;
}

input, textarea {
  width:90%;
  padding:6px;
  margin:5px;
}
</style>

</head>

<body>

<div class="header">
<h2>Fall Checker PRO</h2>
</div>

<div class="card">
  <div id="statusPill">NOT RUNNING</div>
  <div class="big" id="slopePercent">0%</div>
  <div id="ratioText">1:0</div>
  <div id="riseFall">0 mm</div>
</div>

<div class="card">
<label>Distance (mm)</label><br>
<input id="runInput" value="1500"><br>

<label>Flattest (1:N)</label><br>
<input id="flatInput" value="80"><br>

<label>Steepest (1:N)</label><br>
<input id="steepInput" value="50">
</div>

<div class="card">
<h4>Job Details</h4>
<input id="jobAddress" placeholder="Address"><br>
<input id="jobRef" placeholder="Job Reference"><br>
<textarea id="jobNotes" placeholder="Notes"></textarea>
</div>

<div id="panel" class="card"></div>

<script>
(() => {

// ===== STATE =====
let readings = [];
let offset = 0;

let inspectionMode = false;
let stage = 0;
let startAngle = 0;

let finalResult = null;
let photoData = null;

// ===== UI =====
const percentEl = document.getElementById("slopePercent");
const ratioEl = document.getElementById("ratioText");
const fallEl = document.getElementById("riseFall");
const statusEl = document.getElementById("statusPill");
const runInput = document.getElementById("runInput");
const panel = document.getElementById("panel");

// ===== BUTTONS =====
function addBtn(txt, fn){
 let b = document.createElement("button");
 b.innerText = txt;
 b.onclick = fn;
 panel.appendChild(b);
}

addBtn("Enable Motion", enable);
addBtn("Calibrate", calibrate);
addBtn("START INSPECTION", startInspection);
addBtn("Save PDF", savePDF);

addBtn("Shower", ()=>setPreset(80,50));
addBtn("Bathroom", ()=>setPreset(100,60));
addBtn("Laundry", ()=>setPreset(100,60));

// ===== PHOTO =====
let file = document.createElement("input");
file.type = "file";
file.accept = "image/*";
file.onchange = e=>{
 let reader = new FileReader();
 reader.onload = ev => photoData = ev.target.result;
 reader.readAsDataURL(e.target.files[0]);
};
panel.appendChild(file);

// ===== HELPERS =====
function setPreset(f,s){
 document.getElementById("flatInput").value=f;
 document.getElementById("steepInput").value=s;
}

function smooth(v){
 readings.push(v);
 if(readings.length>20) readings.shift();
 return readings.reduce((a,b)=>a+b,0)/readings.length;
}

function percent(a){
 return Math.abs(Math.tan(a*Math.PI/180))*100;
}

function isStable(){
 if(readings.length<10) return false;
 let s=readings.slice(-10);
 let avg=s.reduce((a,b)=>a+b)/s.length;
 let dev=s.reduce((a,b)=>a+Math.abs(b-avg),0)/s.length;
 return dev < 0.25;
}

function movedEnough(){
 if(readings.length<10) return false;
 let first=readings[readings.length-10];
 let last=readings[readings.length-1];
 return Math.abs(last-first)>1;
}

// ===== MOTION =====
async function enable(){
 if(typeof DeviceOrientationEvent.requestPermission==="function"){
  await DeviceOrientationEvent.requestPermission();
 }

 window.addEventListener("deviceorientation", e=>{
  if(e.beta!=null){
   update(e.beta);
  }
 });

 alert("Motion enabled ✅");
}

// ===== CALIBRATE =====
function calibrate(){
 offset = readings[readings.length-1] || 0;
 alert("Calibrated ✅");
}

// ===== START =====
function startInspection(){
 inspectionMode=true;
 stage=0;
 finalResult=null;

 alert("Hold at start");
}

// ===== UPDATE =====
function update(angle){

 if(finalResult) return;

 let a = smooth(angle-offset);

 let p = percent(a);
 let r = p>0 ? 100/p : 0;

 let run = parseFloat(runInput.value)||1000;

 let flat=parseFloat(document.getElementById("flatInput").value);
 let steep=parseFloat(document.getElementById("steepInput").value);

 let min=run/flat;
 let max=run/steep;

 let fall = run * p/100;

 percentEl.innerText = p.toFixed(2)+"%";
 ratioEl.innerText = "1:"+r.toFixed(0);
 fallEl.innerText = fall.toFixed(1)+" mm";

 let compliant = fall>=min && fall<=max;

 statusEl.innerText = compliant ? "✅ COMPLIANT" : "❌ NON-COMPLIANT";
 statusEl.className = compliant ? "good" : "bad";

 // ===== INSPECTION =====
 if(inspectionMode){

  if(stage===0 && isStable()){
   startAngle=a;
   stage=1;
   alert("Start captured ✅ move to waste");
   return;
  }

  if(stage===1 && movedEnough()){
   stage=2;
   return;
  }

  if(stage===2 && isStable()){

   let diff = a-startAngle;

   let p2 = percent(diff);
   let r2 = 100/p2;
   let fall2 = run * p2/100;

   let compliant2 = fall2>=min && fall2<=max;

   percentEl.innerText = p2.toFixed(2)+"%";
   ratioEl.innerText = "1:"+r2.toFixed(0);
   fallEl.innerText = fall2.toFixed(1)+" mm (Req: "+min.toFixed(1)+"-"+max.toFixed(1)+")";

   statusEl.innerText = compliant2 ? "✅ COMPLIANT" : "❌ NON-COMPLIANT";
   statusEl.className = compliant2 ? "good" : "bad";

   finalResult = {p2,r2,fall2,min,max,compliant2};

   inspectionMode=false;

   alert("Inspection complete ✅");
  }
 }

}

// ===== PDF =====
function savePDF(){

 if(!finalResult){
  alert("Run inspection first");
  return;
 }

 let html = `
 <h2>Fall Inspection Report</h2>
 <p><strong>Date:</strong> ${new Date().toLocaleString()}</p>
 <p><strong>Address:</strong> ${document.getElementById("jobAddress").value}</p>
 <p><strong>Job Ref:</strong> ${document.getElementById("jobRef").value}</p>
 <p><strong>Notes:</strong> ${document.getElementById("jobNotes").value}</p>

 <hr>

 <p><strong>Slope:</strong> ${finalResult.p2.toFixed(2)}%</p>
 <p><strong>Ratio:</strong> 1:${finalResult.r2.toFixed(0)}</p>
 <p><strong>Distance:</strong> ${runInput.value} mm</p>
 <p><strong>Measured Fall:</strong> ${finalResult.fall2.toFixed(1)} mm</p>
 <p><strong>Required:</strong> ${finalResult.min.toFixed(1)} - ${finalResult.max.toFixed(1)} mm</p>
 <p><strong>Status:</strong> ${finalResult.compliant2 ? "COMPLIANT" : "NON-COMPLIANT"}</p>

 ${photoData ? `<img src="${photoData}" style="width:100%">` : ""}
 `;

 let w = window.open("");
 w.document.write(html);
 w.print();
}

})();
</script>

</body>
</html>
