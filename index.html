<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>

<body>

<h2>Fall Checker</h2>

<p id="statusPill">NOT RUNNING</p>
<p id="slopePercent">0%</p>
<p id="ratioText">1:0</p>
<p id="riseFall">0 mm</p>

<input id="runInput" value="1500">

<script>
(() => {

let readings = [];
let offset = 0;

// simple smoothing
function smooth(v){
  readings.push(v);
  if(readings.length > 10) readings.shift();
  return readings.reduce((a,b)=>a+b,0)/readings.length;
}

function percent(a){
 return Math.abs(Math.tan(a*Math.PI/180))*100;
}

// UI
const percentEl = document.getElementById("slopePercent");

async function enable(){
  if(typeof DeviceOrientationEvent.requestPermission === "function"){
    await DeviceOrientationEvent.requestPermission();
  }

  window.addEventListener("deviceorientation", e=>{
    if(e.beta !== null){
      let a = smooth(e.beta - offset);
      let p = percent(a);
      percentEl.innerText = p.toFixed(2)+"%";
    }
  });
}

document.body.insertAdjacentHTML("beforeend", "<br><button id='go'>Enable Motion</button>");

document.getElementById("go").onclick = enable;

})();
</script>

</body>
</html>
